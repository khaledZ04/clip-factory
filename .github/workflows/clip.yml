name: Make next clip

on:
  schedule:
    # 10 clips a day (Riyadh): 10am, 12pm, 2pm, 4pm, 5pm, 6pm, 7pm, 8pm, 9pm, 10pm
    - cron: "0 7,9,11,13,14,15,16,17,18,19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: make Part 1 of episode 1, don't send to n8n"
        type: boolean
        default: false
      check_submit:
        description: "Test only: open the Content Rewards form and fill it, but do NOT submit"
        type: boolean
        default: false
      test_file:
        description: "Test only: Google Drive file id to cut"
        type: string
        default: ""
      test_part:
        description: "Test only: part number (0 = first minute)"
        type: string
        default: "2"

permissions:
  contents: write

concurrency:
  group: clip
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Random delay (0-20 min, so posts look natural)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 1200))
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core > /dev/null
          mkdir -p ~/.local/share/fonts
          for f in almarai/Almarai-ExtraBold.ttf tajawal/Tajawal-ExtraBold.ttf; do curl -sSfL -o ~/.local/share/fonts/$(basename $f) https://raw.githubusercontent.com/google/fonts/main/ofl/$f; done
          fc-cache -f > /dev/null && fc-list | grep -E "Almarai|Tajawal"
          pip install -q -U -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-large-v3-turbo-v1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1
      - name: Submit-bot browser
        if: ${{ !inputs.dry_run }}
        run: python -m playwright install chromium-headless-shell > /dev/null
      - name: Old clips cleanup (older than 7 days)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view clips >/dev/null 2>&1 || gh release create clips --title "Clips" --notes "Finished clips (auto, kept 7 days)"
          cutoff=$(date -d '7 days ago' +%s)
          gh api repos/${{ github.repository }}/releases/tags/clips --jq '.assets[] | "\(.id) \(.created_at)"' | while read id created; do
            [ "$(date -d "$created" +%s)" -lt "$cutoff" ] && gh api -X DELETE repos/${{ github.repository }}/releases/assets/$id || true
          done
      - name: Submit bot check (fills the form, does not submit)
        if: ${{ inputs.check_submit }}
        env:
          CR_SESSION: ${{ secrets.CR_SESSION }}
          CHECK_ONLY: "1"
        run: python submit.py https://www.tiktok.com/@jancostudios/video/7400000000000000000
      - name: Make clip
        if: ${{ !inputs.check_submit }}
        env:
          GH_TOKEN: ${{ github.token }}
          N8N_NEXT_URL: ${{ secrets.N8N_NEXT_URL }}
          N8N_READY_URL: ${{ secrets.N8N_READY_URL }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          CR_SESSION: ${{ secrets.CR_SESSION }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          TEST_FILE: ${{ inputs.test_file }}
          TEST_PART: ${{ inputs.test_part }}
        run: python make_clip.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clip
          path: |
            work/*.mp4
            work/*.png
          retention-days: 3
